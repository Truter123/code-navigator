
plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0-beta12'
}

group = 'com.codenavigator'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.codenavigator.CodeNavigatorApplication'
}

run {
    standardInput = System.in
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.26.4'
    implementation 'org.xerial:sqlite-jdbc:3.47.2.0'
    implementation 'io.modelcontextprotocol.sdk:mcp:1.1.0'
    implementation 'info.picocli:picocli:4.7.6'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.2.0.202503040940-r'
    // Explicit no-op SLF4J binding: silences "No SLF4J providers were found" and,
    // critically, prevents any transitive logger from writing to stdout (the MCP
    // stdio transport uses stdout for JSON-RPC — log output there corrupts the protocol).
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.16'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

tasks.named('test') {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName = 'code-navigator'
    archiveClassifier = ''
    mergeServiceFiles()
}

distTar.dependsOn shadowJar
distZip.dependsOn shadowJar
startScripts.dependsOn shadowJar
startShadowScripts.dependsOn jar
